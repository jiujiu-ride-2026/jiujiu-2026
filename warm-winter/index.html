<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>九号暖冬计划</title>
  <link rel="stylesheet" href="app.css">
</head>

<body class="immersive">
  <div class="bg-layer"></div>
  <div class="bg-veil"></div>
  <div class="page">
    <p class="eyebrow">Season 2026</p>
    <h1>九号暖冬计划</h1>
    <p class="lede"><span id="heroLead"></span><br><span id="heroSub"></span></p>

    <a class="choice" id="link1" href="#" target="_blank" rel="noopener noreferrer">
      <span class="arrow">进入 ›</span>
      <span class="tag" id="tag1"></span>
      <span class="name" id="name1"></span>
      <span class="desc" id="desc1"></span>
    </a>

    <a class="choice" id="link2" href="#" target="_blank" rel="noopener noreferrer">
      <span class="arrow">进入 ›</span>
      <span class="tag" id="tag2"></span>
      <span class="name" id="name2"></span>
      <span class="desc" id="desc2"></span>
      <span class="topic" id="topic2"></span>
    </a>

    <hr class="divider">

    <p class="lede" id="period" style="margin:0 0 6px;"></p>
    <p class="foot" style="margin-top:0;">
      提交即表示同意我们使用上述信息用于活动资格审核与福利发放。
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    // 文案全部来自 config.js，改配置即可，不必动这里
    document.getElementById('heroLead').textContent = HERO.lead;
    document.getElementById('heroSub').textContent = HERO.sub;
    document.getElementById('period').textContent = HERO.period;

    ['mileage', 'post'].forEach(function (key, i) {
      var act = ACTIVITIES[key];
      var n = i + 1;
      document.getElementById('tag' + n).textContent = act.tag;
      document.getElementById('name' + n).textContent = act.name;
      document.getElementById('desc' + n).textContent = act.desc;

      var topicEl = document.getElementById('topic' + n);
      if (topicEl) {
        if (act.topic) {
          topicEl.textContent = act.topic;
          topicEl.style.display = '';
        } else {
          topicEl.style.display = 'none';
        }
      }

      document.getElementById('link' + n).href = act.url;
    });
  </script>
</body>

</html>
