<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九九骑行节（2026）· 请选择填写</title>
<style>
  :root{
    --fg:#ffffff; --muted:rgba(255,255,255,0.55); --line:rgba(255,255,255,0.15);
    --card-bg:rgba(0,0,0,0.42); --card-hover:rgba(0,0,0,0.52);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--fg);-webkit-font-smoothing:antialiased;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.60) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0.60) 100%),
      url('kv-portrait.jpg') center/cover no-repeat fixed;
  }
  .wrap{max-width:520px;margin:0 auto;padding:54px 24px 64px;position:relative;z-index:1}
  header{text-align:center;margin-bottom:42px}
  .kicker{font-size:11px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
  h1{font-size:26px;font-weight:600;letter-spacing:1px;line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .sub{margin-top:14px;font-size:14px;color:rgba(255,255,255,0.82);line-height:1.75;text-shadow:0 1px 8px rgba(0,0,0,.3)}
  .card{
    display:flex;align-items:center;justify-content:space-between;
    text-decoration:none;color:inherit;
    background:var(--card-bg);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px;margin-bottom:16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .card:hover,.card:active{
    transform:translateY(-2px);background:var(--card-hover);border-color:rgba(255,255,255,0.28);box-shadow:0 14px 34px rgba(0,0,0,.26);
  }
  .card-content{flex:1;min-width:0}
  .idx{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
  .card h2{font-size:18px;font-weight:600;letter-spacing:.5px}
  .go{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    font-size:13px;font-weight:500;color:rgba(255,255,255,0.92);
  }
  .go::after{content:"→";font-size:15px;transition:transform .2s ease}
  .card:hover .go::after{transform:translateX(4px)}
  .card-icon{
    width:72px;height:72px;border-radius:14px;overflow:hidden;
    flex-shrink:0;margin-left:18px;background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  .card-icon img{width:100%;height:100%;object-fit:cover;display:block}
  .card-icon svg{width:34px;height:34px;stroke:rgba(255,255,255,0.85)}
  footer{text-align:center;margin-top:46px;font-size:12px;color:var(--muted);letter-spacing:1px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">NINEBOT EVENT</div>
    <h1>九九骑行节（2026）</h1>
    <p class="sub">欢迎你参加2026九九骑行节活动，让我们一起骑出去，让美好发生！请选择对应入口填写，三张表单分别收集不同信息，按需选择其一即可</p>
  </header>

  <a class="card" href="https://doc.weixin.qq.com/forms/AHwAVAcbAAgAfgAhwa2AFcCNaTvwR89Lf?page=1">
    <div class="card-content">
      <div class="idx">01</div>
      <h2>路书上传</h2>
      <span class="go">立即填写 →</span>
    </div>
    <div class="card-icon">
      <!-- 表1图标占位：路线/地图标记，等用户提供图片后替换 -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"></path>
        <circle cx="12" cy="9" r="2.5"></circle>
        <path d="M5 22h14"></path>
      </svg>
    </div>
  </a>

  <a class="card" href="https://doc.weixin.qq.com/forms/AHwAVAcbAAgAfgAhwa2AFcCNiBIiDJdWf?page=1">
    <div class="card-content">
      <div class="idx">02</div>
      <h2>里程打卡</h2>
      <span class="go">立即填写 →</span>
    </div>
    <div class="card-icon">
      <img src="icon-ribbons.png" alt="里程荣誉">
    </div>
  </a>

  <a class="card" href="https://doc.weixin.qq.com/forms/AHwAVAcbAAgAfgAhwa2AFcCNkbokpW59f?page=1">
    <div class="card-content">
      <div class="idx">03</div>
      <h2>发帖链接上传</h2>
      <span class="go">立即填写 →</span>
    </div>
    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </div>
  </a>

  <footer>扫码进入 · 信息安全收集<br>本页面仅作跳转引导，不存储任何填写数据</footer>
</div>
</body>
</html>
