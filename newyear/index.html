<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨年「骑」遇，一路向新 · 九号骑遇投稿</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#191919; --muted:#8c8983;
    --line:#e8e5df; --accent:#2f6b5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--fg);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:32px 24px 64px}
  header{text-align:center;margin-bottom:44px}
  .banner{
    display:block;width:100%;height:auto;
    border-radius:14px;margin-bottom:32px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
  }
  .kicker{
    font-size:11px;letter-spacing:4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:28px;
  }
  h1{font-size:30px;font-weight:500;letter-spacing:1px;line-height:1.5}
  h1 span{display:block}
  .sub{margin-top:18px;font-size:14px;color:var(--muted);line-height:1.8;letter-spacing:.3px}
  .date{margin-top:24px;font-size:12px;color:var(--muted);letter-spacing:1px}
  .date::before,.date::after{
    content:"";display:inline-block;width:22px;height:1px;
    background:var(--line);vertical-align:middle;margin:0 12px;
  }
  .card{
    display:block;text-decoration:none;color:inherit;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:26px 24px;margin-bottom:16px;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .card:hover,.card:active{
    transform:translateY(-2px);border-color:#c9c4ba;
    box-shadow:0 12px 32px rgba(0,0,0,.05);
  }
  .idx{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
  .card h2{font-size:19px;font-weight:500;letter-spacing:.5px;line-height:1.5;margin-bottom:10px}
  .card p{font-size:13px;color:var(--muted);line-height:1.8}
  .go{
    display:inline-flex;align-items:center;gap:8px;margin-top:20px;
    font-size:13px;font-weight:500;color:var(--fg);
  }
  .go::after{content:"→";font-size:15px;transition:transform .2s ease}
  .card:hover .go::after{transform:translateX(4px)}
  footer{
    text-align:center;margin-top:56px;font-size:11px;
    color:var(--muted);letter-spacing:.8px;line-height:2;
  }
  @media(max-width:380px){
    h1{font-size:26px}
    .wrap{padding:20px 20px 48px}
    .banner{margin-bottom:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="banner" src="banner.jpg" alt="跨年骑遇 · 红灯笼下的骑行剪影">
    <div class="kicker">NINEBOT · NEW YEAR RIDE</div>
    <h1><span>跨年「骑」遇，</span><span>一路向新</span></h1>
    <p class="sub">晒出你的跨年路线，和九号一起骑向 2027</p>
    <p class="date">投稿时间：2026年12月1日–2026年12月22日</p>
  </header>

  <a class="card" href="https://segway-ninebot.feishu.cn/share/base/form/shrcn3LJYLFy7Lzzj1oZWEuRhqd">
    <div class="idx">01 / 路书投稿</div>
    <h2>「跨年骑遇」路书投稿</h2>
    <p>规划一条独特且有趣的跨年骑行路线，包含 3–5 个点位、实拍图与途经点简要文字描述，上传原创高清横版封面图。</p>
    <span class="go">进入填写</span>
  </a>

  <a class="card" href="https://segway-ninebot.feishu.cn/share/base/form/shrcnfvwm4pKCGtpR0NqxY1bnCg">
    <div class="idx">02 / 九友发声</div>
    <h2>【九友发声】发帖一起跨新年</h2>
    <p>带 #九号路书 与 #跨年骑遇 双话题在九号出行 App 发帖，同步至小红书或抖音，回传帖子链接。</p>
    <span class="go">进入填写</span>
  </a>

  <footer>扫码进入 · 本页面仅作跳转引导，不存储任何填写数据</footer>
</div>
</body>
</html>
